<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talonario Rifa Huirapuca - Edición Imprimible</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            background-color: #f1f5f9;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* CONTROLES */
        .controls {
            background: #ffffff;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
            display: flex;
            gap: 16px;
            align-items: center;
            width: 210mm;
            border: 1px solid #e2e8f0;
            flex-wrap: wrap;
        }

        .controls h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.2px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-group label {
            font-size: 10px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group input {
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            width: 85px;
            font-weight: 600;
            font-size: 13px;
            outline: none;
        }

        .btn {
            background-color: #15803d;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn:hover {
            background-color: #166534;
        }

        .btn-print {
            background-color: #0f172a;
            margin-left: auto;
        }

        .btn-print:hover {
            background-color: #1e293b;
        }

        #pages-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .a4-page {
            background-color: #ffffff;
            width: 210mm;
            height: 297mm;
            padding: 10mm;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            gap: 5mm;
        }

        @media print {
            body {
                background: none;
                padding: 0;
            }
            .controls {
                display: none;
            }
            #pages-container {
                gap: 0;
            }
            .a4-page {
                box-shadow: none;
                width: 100%;
                height: 297mm;
                padding: 8mm 10mm;
                page-break-after: always;
            }
            .a4-page:last-child {
                page-break-after: auto;
            }
        }

        /* ESTRUCTURA DEL BOLETO */
        .ticket-container {
            display: flex;
            height: 64mm;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
            background: #ffffff;
            position: relative;
        }

        /* TRAMA COMPLETA Y DENSA DE MARCA DE AGUA (-30 DEGRADOS) */
        .watermark-container {
            position: absolute;
            top: -80%;
            left: -50%;
            width: 220%;
            height: 260%;
            transform: rotate(-30deg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            user-select: none;
            z-index: 10;
        }

        .watermark-line {
            font-size: 10px;
            font-weight: 800;
            color: rgba(15, 23, 42, 0.075);
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
            width: 100%;
            text-align: center;
        }

        .watermark-line:nth-child(even) {
            transform: translateX(80px);
        }

        /* STUB / TROQUEL */
        .stub {
            width: 60mm;
            background-color: #fafafa;
            border-right: 1px dashed #cbd5e1;
            padding: 5mm 6mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        .stub-header {
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 4px;
        }

        .stub-tag {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #94a3b8;
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }

        .stub-title {
            font-weight: 800;
            font-size: 11px;
            color: #9f1239;
            margin: 0;
            letter-spacing: 0.3px;
        }

        .stub-subtitle {
            font-size: 9px;
            font-weight: 600;
            margin: 1px 0 0 0;
            color: #15803d;
        }

        .stub-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 6px 0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .input-group label {
            font-size: 8.5px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group .line {
            border-bottom: 1px solid #cbd5e1;
            height: 12px;
        }

        .stub-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-top: 4px;
            border-top: 1px solid #f1f5f9;
        }

        .stub-price {
            font-size: 9.5px;
            font-weight: 700;
            color: #475569;
        }

        .ticket-number {
            font-size: 14px;
            font-weight: 800;
            color: #9f1239;
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
        }

        /* MAIN TICKET BODY */
        .main {
            flex-grow: 1;
            padding: 5mm 8mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #ffffff;
            position: relative;
            z-index: 2;
        }

        .main-header {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-box {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .title-container {
            flex-grow: 1;
        }

        .club-badge {
            font-size: 8.5px;
            font-weight: 700;
            color: #15803d;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 1px;
        }

        .main-title {
            font-size: 18px;
            font-weight: 800;
            color: #0f172a;
            margin: 0;
            letter-spacing: -0.2px;
            line-height: 1.1;
        }

        .main-subtitle {
            font-size: 10px;
            font-weight: 500;
            color: #64748b;
            margin: 2px 0 0 0;
        }

        /* PREMIOS */
        .prizes-section {
            background-color: #fafafa;
            border: 1px solid #f1f5f9;
            border-radius: 6px;
            padding: 6px 12px;
            margin: 3px 0;
            position: relative;
            z-index: 3;
        }

        .prizes-label {
            font-size: 8.5px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
            display: block;
        }

        .prizes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .prize-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .prize-icon-box {
            width: 24px;
            height: 24px;
            border-radius: 5px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .prize-details {
            display: flex;
            flex-direction: column;
        }

        .prize-rank {
            font-size: 8px;
            font-weight: 700;
            color: #9f1239;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .prize-name {
            font-size: 11px;
            font-weight: 700;
            color: #1e293b;
        }

        /* BARRA SORTEO */
        .draw-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 10px;
            background: #f8fafc;
            border-left: 3px solid #15803d;
            border-radius: 0 4px 4px 0;
            font-size: 9.5px;
            position: relative;
            z-index: 3;
        }

        .draw-date {
            color: #334155;
            font-weight: 500;
        }

        .draw-date strong {
            color: #0f172a;
            font-weight: 700;
        }

        .facebook-live {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #1877f2;
            font-weight: 700;
            font-size: 9px;
        }

        .live-indicator {
            width: 6px;
            height: 6px;
            background-color: #ef4444;
            border-radius: 50%;
        }

        /* PIE DE PÁGINA */
        .main-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-top: 2px;
            position: relative;
            z-index: 3;
        }

        .price-container {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .price-caption {
            font-size: 9px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .price-tag {
            font-size: 16px;
            font-weight: 800;
            color: #15803d;
            letter-spacing: -0.3px;
        }
    </style>
</head>
<body>

    <div class="controls controls-print">
        <h2>Generador de Talonario</h2>
        <div class="control-group">
            <label for="start-num">Nº Inicial:</label>
            <input type="number" id="start-num" value="1" min="1">
        </div>
        <div class="control-group">
            <label for="count">Boletos totales:</label>
            <input type="number" id="count" value="12" min="1" step="4">
        </div>
        <button class="btn" onclick="generateTickets()">Generar Boletos</button>
        <a href="gestion.html" class="btn" style="background:#0f172a">📊 Sistema de Gestión</a>
        <button class="btn btn-print" onclick="window.print()">🖨️ Imprimir (PDF)</button>
    </div>

    <div id="pages-container">
        <!-- Boletos insertados con JS -->
    </div>

    <script>
        function formatNumber(num) {
            return String(num).padStart(6, '0');
        }

        function generateTickets() {
            const startNum = parseInt(document.getElementById('start-num').value) || 1;
            const count = parseInt(document.getElementById('count').value) || 12;
            const container = document.getElementById('pages-container');
            container.innerHTML = '';
            
            let currentPage = null;
            
            for (let i = 0; i < count; i++) {
                if (i % 4 === 0) {
                    currentPage = document.createElement('div');
                    currentPage.className = 'a4-page';
                    container.appendChild(currentPage);
                }
                
                const numStr = formatNumber(startNum + i);
                
                const ticketHtml = `
                    <div class="ticket-container">
                        <!-- TRAMA COMPLETA Y DENSA DE MARCA DE AGUA (-30°) -->
                        <div class="watermark-container">
                            <div class="watermark-line">HUIRAPUCA RUGBY CLUB - CONCEPCIÓN • HUIRAPUCA RUGBY CLUB - CONCEPCIÓN</div>
                            <div class="watermark-line">HUIRAPUCA RUGBY CLUB - CONCEPCIÓN • HUIRAPUCA RUGBY CLUB - CONCEPCIÓN</div>
                            <div class="watermark-line">HUIRAPUCA RUGBY CLUB - CONCEPCIÓN • HUIRAPUCA RUGBY CLUB - CONCEPCIÓN</div>
                            <div class="watermark-line">HUIRAPUCA RUGBY CLUB - CONCEPCIÓN • HUIRAPUCA RUGBY CLUB - CONCEPCIÓN</div>
                            <div class="watermark-line">HUIRAPUCA RUGBY CLUB - CONCEPCIÓN • HUIRAPUCA RUGBY CLUB - CONCEPCIÓN</div>
                            <div class="watermark-line">HUIRAPUCA RUGBY CLUB - CONCEPCIÓN • HUIRAPUCA RUGBY CLUB - CONCEPCIÓN</div>
                            <div class="watermark-line">HUIRAPUCA RUGBY CLUB - CONCEPCIÓN • HUIRAPUCA RUGBY CLUB - CONCEPCIÓN</div>
                            <div class="watermark-line">HUIRAPUCA RUGBY CLUB - CONCEPCIÓN • HUIRAPUCA RUGBY CLUB - CONCEPCIÓN</div>
                        </div>

                        <!-- STUB / TROQUEL -->
                        <div class="stub">
                            <div class="stub-header">
                                <span class="stub-tag">Club Huirapuca</span>
                                <p class="stub-title">BONO CONTRIBUCIÓN</p>
                                <p class="stub-subtitle">Rugby Infantil y Prejuveniles</p>
                            </div>
                            <div class="stub-body">
                                <div class="input-group">
                                    <label>Nombre y Apellido</label>
                                    <div class="line"></div>
                                </div>
                                <div class="input-group">
                                    <label>Teléfono</label>
                                    <div class="line"></div>
                                </div>
                            </div>
                            <div class="stub-footer">
                                <span class="stub-price">Valor $10.000</span>
                                <span class="ticket-number">Nº ${numStr}</span>
                            </div>
                        </div>

                        <!-- MAIN TICKET -->
                        <div class="main">
                            <div class="main-header">
                                <div class="logo-box">
                                    <!-- LOGO HUIRAPUCA VECTORIAL RESTAURADO -->
                                    <svg width="42" height="42" viewBox="0 0 100 100">
                                        <defs>
                                            <clipPath id="logo-diamond">
                                                <polygon points="50,2 98,50 50,98 2,50"/>
                                            </clipPath>
                                        </defs>
                                        <g clip-path="url(#logo-diamond)">
                                            <rect x="0" y="0" width="100" height="20" fill="#15803d"/>
                                            <rect x="0" y="20" width="100" height="20" fill="#9f1239"/>
                                            <rect x="0" y="40" width="100" height="20" fill="#15803d"/>
                                            <rect x="0" y="60" width="100" height="20" fill="#9f1239"/>
                                            <rect x="0" y="80" width="100" height="20" fill="#15803d"/>
                                        </g>
                                        <polygon points="50,2 98,50 50,98 2,50" fill="none" stroke="#0f172a" stroke-width="3"/>
                                        <text x="50" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="46" fill="#ffffff" text-anchor="middle">H</text>
                                    </svg>
                                </div>
                                <div class="title-container">
                                    <span class="club-badge">Club Huirapuca</span>
                                    <h1 class="main-title">BONO CONTRIBUCIÓN</h1>
                                    <p class="main-subtitle">A beneficio del Rugby infantil y prejuveniles</p>
                                </div>
                            </div>
                            
                            <!-- PRIZES SECTION -->
                            <div class="prizes-section">
                                <span class="prizes-label">Premios del Sorteo</span>
                                <div class="prizes-grid">
                                    <div class="prize-item">
                                        <div class="prize-icon-box">
                                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6h-5l-2 5h4l3 3.5h3.5"/><path d="M9 11l-3 6.5"/><path d="M15 17.5h-6"/></svg>
                                        </div>
                                        <div class="prize-details">
                                            <span class="prize-rank">1º Premio</span>
                                            <span class="prize-name">Moto Eléctrica</span>
                                        </div>
                                    </div>
                                    <div class="prize-item">
                                        <div class="prize-icon-box">
                                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="2"/><path d="M9 18h7"/><path d="M18 16V4h-3"/><path d="M15 4h5"/></svg>
                                        </div>
                                        <div class="prize-details">
                                            <span class="prize-rank">2º Premio</span>
                                            <span class="prize-name">Monopatín Electrónico</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- ELEGANT DRAW HIGHLIGHT -->
                            <div class="draw-bar">
                                <div class="draw-date">
                                    Sorteo: <strong>12 de Septiembre de 2026</strong>
                                </div>
                                <div class="facebook-live">
                                    <span class="live-indicator"></span>
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="#1877f2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                                    <span>EN VIVO en Facebook Huirapuca</span>
                                </div>
                            </div>
                            
                            <!-- FOOTER PRICE & NUMBER -->
                            <div class="main-footer">
                                <div class="price-container">
                                    <span class="price-caption">Valor</span>
                                    <span class="price-tag">$ 10.000</span>
                                </div>
                                <span class="ticket-number">Nº ${numStr}</span>
                            </div>
                        </div>
                    </div>
                `;
                currentPage.insertAdjacentHTML('beforeend', ticketHtml);
            }
        }
        
        // Execution
        generateTickets();
    </script>
</body>
</html>
